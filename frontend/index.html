<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/semanggi.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" />
    <script>
      try {
        var t = localStorage.getItem("amiga.theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
    <title>amiga · Robot Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
